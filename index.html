<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNAKE</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  
</head>
<body>
  <!-- MENÚ -->
  <div class="main-menu">
    <img src="./assets/logo.png" alt="" style="width: 200px; height: 200px;">
    <h1 class="logo">  SNAKE</h1>
    <p>Selecciona la dificultad</p>
    <button onclick="startGame(150)">Fácil</button>
    <button onclick="startGame(90)">Difícil</button>
  </div>

  <div class="wrapper">
    <div class="game-details">
      <div class="score">score: 0</div>
      <div class="high-score">high score: 0</div>
    </div>
    <div class="play-board"></div>
  
    <div class="mobile-controls">
      <button class="control up">⬆️</button>
      <div class="middle-row">
        <button class="control left">⬅️</button>
        <button class="control right">➡️</button>
      </div>
      <button class="control down">⬇️</button>
    </div>
  </div>

  <!-- Pantalla de instrucciones, oculta al principio -->
  <div id="start-screen" class="start-screen">
    <div class="start-content">
      <h2>Instrucciones</h2>
      <p>Usa las flechas del teclado para mover la serpiente.</p>
      <button id="start-btn">¡Jugar!</button>
    </div>
  </div>

  <!-- Opciones de sonido -->
  <div class="options-menu hidden" id="sound-options">
    <h3>🎵 Opciones de sonido</h3>
    <div class="sound-controls">
      <button id="mute-btn">🔊</button>
      <br />
      <label for="volume-slider">Volumen</label>
      <input
        type="range"
        id="volume-slider"
        min="0"
        max="1"
        step="0.01"
        value="0.3"
      />
    </div>
  </div>
  
  <!-- Modal de game over -->
  <div class="game-over-modal hidden">
    <div class="modal-content">
      <h2>¡Has perdido!</h2>
      <p>¿Quieres volver a jugar?</p>
      <button id="restart-btn">Reiniciar</button>
      <button id="exit-btn">Salir</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
